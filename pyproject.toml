[project]
name = "url-shortener-analytics-platform"
version = "0.1.0"
description = "Production-oriented analytics platform built on top of the url-shortener OLTP application. Phase 1: analytics foundation and batch ingestion."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "boto3>=1.34",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "faker>=28.0",
]

[project.scripts]
ingest = "url_shortener_analytics.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["ingestion/src"]
include = ["url_shortener_analytics*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
markers = [
    "integration: requires real Postgres + MinIO (docker compose up -d) — skipped by default, see ingestion/tests/integration/README.md",
]
addopts = "-m 'not integration'"
