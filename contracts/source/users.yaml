# Data contract for the source `users` table (HYPOTHETICAL -- see
# schemas/source/users.md and ADR-008). See
# docs/analytics-engineering-guide.md, Section 12.
#
# Every column also declares `pii`. This is a required field, not an
# optional one -- see pii.py and Section 23 for the full reasoning.

table: users
version: 1
owner: analytics-platform-team
description: >
  Hypothetical users table, standing in for the real application's
  not-yet-built accounts feature. See schemas/source/users.md.
freshness_sla: "extracted at least once per pipeline run (full load; see ingestion/configs/pipelines.yaml)"

columns:
  - name: id
    type: integer
    nullable: false
    pii: none
    description: Surrogate PK, autoincrement.
  - name: email
    type: text
    nullable: false
    pii: direct
    description: >
      Unique. Directly identifies one natural person by itself, with no
      other data needed -- Section 23's one "direct" column. Reaches
      Bronze unmasked today (full load extracts every column); excluded
      from dim_user by Section 10.4's design decision, so it never
      reaches the analytical layer.
  - name: plan_type
    type: text
    nullable: false
    pii: none
    description: "FREE | PREMIUM. Not a database-level enum -- see quality_rules."
  - name: created_at
    type: timestamp
    nullable: false
    pii: none
    description: Set at insert.

quality_rules:
  - "email is unique"
  - "plan_type in ('FREE', 'PREMIUM') -- not enforced at the database level; monitored, not guaranteed"
