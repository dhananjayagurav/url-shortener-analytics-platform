# Which source tables this pipeline extracts, and how.
#
# This file exists so "which tables does the pipeline touch, and with what
# load strategy" is a config change, not a code change -- see
# docs/analytics-engineering-guide.md, Architectural Principles,
# "Metadata-driven processing". As of Section 15, `run` (see cli.py)
# dispatches each table to full or incremental load based on this file's
# `load_type` -- see ADR-005, now "implemented".

pipeline_name: url_shortener_bronze_ingestion

tables:
  - name: urls
    load_type: full
  - name: users
    load_type: full
  - name: clicks
    load_type: incremental   # id-based watermark; see guide Section 15
